        - generic [ref=e192]: "Todos los que quieras. LearnAI funciona para cualquier tema: programación, idiomas, diseño, música, fotografía, marketing, finanzas, cocina… si existe en YouTube, LearnAI puede enseñarlo."
      - generic [ref=e193]:
        - generic [ref=e194]: ¿Qué diferencia hay entre los planes?▾
        - generic [ref=e195]: El plan gratuito limita a 1 roadmap/mes y 10 mensajes/día. El plan Básico (7€/mes) permite 5 roadmaps y 50 mensajes, sin anuncios. El plan Pro (17€/mes) es completamente ilimitado con exportación PDF.
