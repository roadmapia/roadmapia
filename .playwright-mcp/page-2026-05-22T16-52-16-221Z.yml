      - generic [ref=e181]:
        - generic [ref=e182]: ¿Cómo genera la IA mi roadmap?▾
        - generic [ref=e183]: Usamos Claude (de Anthropic), uno de los modelos de IA más avanzados del mundo. Analizamos tu nivel actual, el tema elegido y las horas disponibles para diseñar un plan realista con fases, lecciones y recursos reales.
      - generic [ref=e184]:
        - generic [ref=e185]: ¿Puedo cancelar en cualquier momento?▾
        - generic [ref=e186]: Sí, sin permanencia ni penalizaciones. Si cancelas, el plan permanece activo hasta el fin del período pagado. Tus roadmaps nunca se borran.
      - generic [ref=e187]:
        - generic [ref=e188]: ¿Los vídeos son realmente de YouTube?▾
        - generic [ref=e189]: Sí. Para cada lección buscamos automáticamente en YouTube los vídeos más relevantes. Los embebemos directamente para que puedas verlos sin salir de la plataforma.
      - generic [ref=e190]:
