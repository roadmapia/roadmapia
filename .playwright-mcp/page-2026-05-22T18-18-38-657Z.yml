        - generic [ref=e576]:
          - heading "Frequently asked questions" [level=2] [ref=e578]
          - generic [ref=e579]:
            - generic [ref=e581]:
              - generic [ref=e582]:
                - heading "I don't have time to build courses. How much work do I actually have to do?" [level=3] [ref=e583] [cursor=pointer]
                - button [ref=e584]:
                  - img [ref=e586]
              - paragraph [ref=e591]: Almost none. That’s why we built Learniverse. You simply upload your existing documents (PDFs, Word docs) or paste a link to your website/Notion pages. Our AI acts as your instructional designer, instantly structuring that raw info into interactive lessons, quizzes, and summaries. You review it, click "Publish," and you're done.
            - generic [ref=e593]:
              - generic [ref=e594]:
                - heading "My team's knowledge is scattered across Google Docs, Teams, and Powerpoints. Can I use that?" [level=3] [ref=e595] [cursor=pointer]
                - button [ref=e596]:
                  - img [ref=e598]
              - paragraph [ref=e600]: Absolutely. This is exactly what Learniverse is for. We turn your "messy" folders into a structured, automated training hub. You can upload documents directly, or embed your Loom/YouTube videos. The AI will watch your videos and read your docs to generate the training content for you.
            - generic [ref=e602]:
              - generic [ref=e603]:
                - heading "Will the AI generate generic content, or is it specific to my business?" [level=3] [ref=e604] [cursor=pointer]
                - button [ref=e605]:
                  - img [ref=e607]
              - paragraph [ref=e609]: It is 100% specific to your business. Unlike generic AI tools like ChatGPT that "hallucinate," Learniverse is grounded in your source material. It uses your uploaded documents and context to build the training, ensuring your team learns exactly your SOPs and your brand voice.
            - generic [ref=e611]:
              - generic [ref=e612]:
                - heading "Are there limits on how many courses I can build?" [level=3] [ref=e613] [cursor=pointer]
                - button [ref=e614]:
                  - img [ref=e616]
              - paragraph [ref=e618]: No. On the Team plan, you get Unlimited AI Course Generation. We don't believe in punishing you for training your team. Whether you need 5 courses or 50, you can build as much as you need without worrying about "credits" or limits.
            - generic [ref=e620]:
              - generic [ref=e621]:
                - heading "How long does it take to get my team onboarded?" [level=3] [ref=e622] [cursor=pointer]
                - button [ref=e623]:
                  - img [ref=e625]
              - paragraph [ref=e627]: Minutes. Once your training hub is ready (which takes just a few clicks), you can invite your team members via email. They get instant access to their assigned learning paths on their own dashboard. You can track their progress and completion rates immediately.
            - generic [ref=e629]:
              - generic [ref=e630]:
                - heading "I’m an agency/consultant. Can I use this to train my clients?" [level=3] [ref=e631] [cursor=pointer]
                - button [ref=e632]:
                  - img [ref=e634]
              - paragraph [ref=e636]: Yes! Many of our customers are agencies who use Learniverse to "productize" their services. You can create a branded training portal specifically for your clients to onboard them faster. If you need to manage multiple distinct client groups, contact us about our Enterprise plan.
