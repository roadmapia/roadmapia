{% extends "base.html" %}
{% block title %}Nueva contraseña — RoadmapIA{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo-mark">🧠 RoadmapIA</div>
    <h1>Nueva contraseña</h1>
    <p class="sub">Elige una contraseña segura de al menos 8 caracteres.</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/auth/reset/{{ token }}">
      <div class="form-group">
        <label for="password">Nueva contraseña</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="Mínimo 8 caracteres" required minlength="8" autofocus />
      </div>
      <div class="form-group">
        <label for="password2">Repite la contraseña</label>
        <input type="password" id="password2" name="password2" class="form-control"
               placeholder="Repite la contraseña" required minlength="8" />
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:0.4rem">
        Guardar nueva contraseña →
      </button>
    </form>
  </div>
</div>
{% endblock %}
